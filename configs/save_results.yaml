experiment_name: save_results_run
output_root: runs

seed: 42
seeds: [42]

data:
  source: synthetic
  synthetic:
    feature_dim: 16
    graph:
      type: ba
      n: 180
      m: 3
      directed: false
      weighted: false

task:
  target: diffusion
  classical_targets: [degree, pagerank]

diffusion:
  method: ic
  params: {p: 0.1}
  mc_runs: 20
  max_steps: 40
  n_jobs: 1
  use_cache: true
  cache_dir: cache/labels

split:
  train_ratio: 0.6
  val_ratio: 0.2

model:
  names: [gcn]
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2

train:
  device: auto
  epochs: 80
  lr: 0.01
  weight_decay: 0.0005
  early_stopping_patience: 20
  lr_decay: 0.5
  lr_patience: 8
  grad_clip: 1.0
  log_every: 10

metrics:
  topk: [10, 20, 50]

explain:
  node_id: 0
  methods: [gnnexplainer, gradient, random]
  fidelity_k: [5, 10, 20, 40]
