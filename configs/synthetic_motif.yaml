experiment_name: synthetic_motif_explainability
output_root: runs

seed: 42
seeds: [42, 52, 62]

data:
  source: synthetic
  synthetic:
    feature_dim: 16
    graph:
      type: motif
      n: 300
      motif_count: 10
      motif_spokes: 6
      base_p: 0.02

task:
  target: diffusion
  classical_targets: [degree, pagerank]

diffusion:
  method: lt
  params: {}
  mc_runs: 40
  max_steps: 40
  n_jobs: 1
  use_cache: true
  cache_dir: cache/labels

split: {train_ratio: 0.6, val_ratio: 0.2}

model:
  names: [gcn, gat]
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2

train:
  device: auto
  epochs: 180
  lr: 0.01
  weight_decay: 0.0005
  early_stopping_patience: 30
  lr_decay: 0.5
  lr_patience: 10
  grad_clip: 1.0
  log_every: 20

metrics:
  topk: [10, 20, 50]

explain:
  node_id: 0
  methods: [gnnexplainer, pgexplainer, gradient, random]
  fidelity_k: [5, 10, 20, 40]
