experiment_name: real_karate_fast
output_root: runs

seed: 42
seeds: [42]

data:
  source: real
  real:
    name: karate
    root: data
    feature_dim: 16

task:
  target: diffusion
  classical_targets: [degree, pagerank]

diffusion:
  method: ic
  params: {p: 0.1}
  mc_runs: 20
  max_steps: 20
  n_jobs: 1
  use_cache: true
  cache_dir: cache/labels

split: {train_ratio: 0.6, val_ratio: 0.2}

model:
  names: [gcn]
  hidden_dim: 32
  num_layers: 2
  dropout: 0.2

train:
  device: auto
  epochs: 80
  lr: 0.01
  weight_decay: 0.0005
  early_stopping_patience: 15
  lr_decay: 0.5
  lr_patience: 6
  grad_clip: 1.0
  log_every: 10

metrics:
  topk: [5, 10, 20]

explain:
  node_id: 0
  methods: [gradient, random]
  fidelity_k: [3, 6, 10]
